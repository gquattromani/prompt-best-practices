description = "Assess a prompt against the 7-component framework, then rebuild it for the target runtime"
prompt = "Assess the prompt in {{args}} (if empty, my previous message) with the prompt-best-practices framework before executing anything. Classify the task tier (quick / standard / complex), then mark each of the 7 components — Task, Role, Context, Examples, Output specification, Constraints, Structure — as [OK], [~~] or [--] with a one-line rationale. Present the diagnosis and offer the exit: I can reply skip, go, execute or as-is to run the prompt unchanged. Then ask ONE question per message in priority order (Task and success criteria, Output spec, Examples, Constraints, Role and Context), capped at 2 questions for quick, 3 for standard, 5 for complex. Before writing the final prompt, resolve the target runtime: a model or vendor I named wins; otherwise the host you are running in (Claude Code to Anthropic Claude, Codex to OpenAI GPT, Gemini CLI or Antigravity or Jules to Google Gemini, Grok Build to xAI Grok); otherwise the universal baseline. Compose for that runtime: Claude → XML tags, long data at the top and task at the end, remove self-check clauses on Opus 5, state response length explicitly; OpenAI → Markdown headings or XML, no repeated instruction, no example that does not change behavior; Google Gemini → Markdown or XML used consistently, data first and instruction last, explicit length and tone because the default is terse, no sampling or temperature instruction; xAI Grok → keep Role and spell out edge cases, enumerate the context paths, describe tool use as native function calling and never as an XML envelope; unknown or a multi-model host → XML tags (a hidden model may be Claude and no other vendor penalizes them), context first, at most one example, explicit length, rules with their reason, no vendor-specific parameter text, and say in one line which runtime you assumed. Build the smallest sufficient prompt, present it, and wait for a one-word confirmation before executing it. No emoji, use [OK] / [~~] / [--], reply in my language."
